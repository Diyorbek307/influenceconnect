# Деплой InfluenceConnect (Flutter Web) на Render как бесплатный статический сайт.
#
# Render не содержит Flutter в окружении сборки, поэтому мы клонируем стабильный
# Flutter SDK прямо в buildCommand, собираем web-версию и публикуем build/web.
services:
  - type: web
    name: influenceconnect
    runtime: static
    # SUPABASE_URL и SUPABASE_ANON_KEY задаются в Render → Environment.
    # Если они пустые — приложение соберётся в локальном (демо) режиме.
    buildCommand: |
      if [ ! -d "$HOME/flutter" ]; then
        git clone https://github.com/flutter/flutter.git -b stable --depth 1 "$HOME/flutter"
      fi
      export PATH="$HOME/flutter/bin:$PATH"
      flutter --version
      flutter pub get
      flutter build web --release \
        --dart-define=SUPABASE_URL="${SUPABASE_URL:-}" \
        --dart-define=SUPABASE_ANON_KEY="${SUPABASE_ANON_KEY:-}"
    staticPublishPath: build/web
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
    # SPA-роутинг: любые пути отдаём на index.html
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    pullRequestPreviewsEnabled: false
