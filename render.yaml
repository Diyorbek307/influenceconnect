# Деплой InfluenceConnect (Flutter Web) на Render как бесплатный статический сайт.
#
# Render не содержит Flutter в окружении сборки, поэтому мы клонируем стабильный
# Flutter SDK прямо в buildCommand, собираем web-версию и публикуем build/web.
services:
  - type: web
    name: influenceconnect
    runtime: static
    # Ключи Supabase зашиты в lib/data/supabase_config.dart (публичный ключ).
    # При желании их можно переопределить через --dart-define.
    buildCommand: |
      if [ ! -d "$HOME/flutter" ]; then
        git clone https://github.com/flutter/flutter.git -b stable --depth 1 "$HOME/flutter"
      fi
      export PATH="$HOME/flutter/bin:$PATH"
      flutter --version
      flutter pub get
      flutter build web --release
    staticPublishPath: build/web
    # SPA-роутинг: любые пути отдаём на index.html
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    pullRequestPreviewsEnabled: false
